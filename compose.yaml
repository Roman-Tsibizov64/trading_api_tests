services:
  api:
    image: node:20-alpine
    working_dir: /data
    command: npx -y json-server@0.17.4 --host 0.0.0.0 --port 3000 db.json
    ports:
      - "3000:3000"
    volumes:
      - ./stand:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/accounts"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s